# ==============================================================================
# HelpFlow - Soporte TI (support-ticket-service)
# Configuración del Microservicio Principal
# ==============================================================================

# 1. Configuración básica de la aplicación y puerto del servidor
spring.application.name=support-ticket-service
server.port=8080

# 2. Conexión a la Base de Datos PostgreSQL (con variables de entorno y valores por defecto)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpflow_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Migraciones automáticas de base de datos con Flyway (V1, V2 y V3)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 4. Configuración avanzada de JPA e Hibernate (validación de esquema y optimización de lotes)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Tamaño de lote para consultas y evitar el problema de consultas N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# 5. Seguridad y autenticación con JWT (clave secreta de 256 bits y tiempo de expiración)
# Clave HMAC-SHA256 codificada en Base64
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Tiempo de expiración del token: 24 horas (en milisegundos)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# 6. Comunicación REST con el microservicio de disponibilidad técnica (technician-dispatch-service)
technician.dispatch.service.url=${TECHNICIAN_DISPATCH_SERVICE_URL:http://localhost:8081}

# 7. Observabilidad y Monitoreo con Spring Boot Actuator y Micrometer
# Endpoints expuestos públicamente para chequeo de salud y métricas
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# 8. Documentación interactiva de la API con OpenAPI 3 y Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
